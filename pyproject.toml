[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermesxgiga"
version = "0.1.0"
description = "Connect GigaChat (Sber LLM) to a Hermes-style messenger bot"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["gigachat>=0.1.30"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "fastapi>=0.110", "httpx>=0.27"]
proxy = ["fastapi>=0.110", "uvicorn>=0.27"]

[tool.setuptools.packages.find]
include = ["hermesxgiga*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
